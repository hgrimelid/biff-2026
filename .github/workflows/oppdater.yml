name: Oppdater og publiser

# Hentar programmet frå biff.no og publiserer til GitHub Pages.
# Blir starta kvart 10. minutt av cron-job.org (workflow_dispatch via API-et), fordi
# GitHub sin eigen cron berre køyrer kvar 4.–5. time for dette repoet. GitHub-cron
# står som reserve. Etter FESTIVAL_END gjer berre push noko.
# Dataa blir ikkje committa – kvar køyring publiserer det som er ferskt.

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *" # kvart 10. min; GitHub kan forseinke planlagde køyringar
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FESTIVAL_END: "2026-10-22"

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - id: guard
        name: Stopp automatiske køyringar etter festivalen
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "$(TZ=Europe/Oslo date +%F)" \> "$FESTIVAL_END" ]; then
            echo "Festivalen er over – hoppar over."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Hent program frå biff.no
        run: python3 scrape.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test planleggaren
        run: node --test tests/*.test.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
